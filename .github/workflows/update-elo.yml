name: Update Elo ratings

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-elo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install datafc
        run: python -m pip install --upgrade pip datafc

      - name: Fetch latest World Football Elo ratings
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from datafc import eloratings

          df = eloratings.world_ranking_data()
          print('Columns:', list(df.columns))

          # datafc exposes the current eloratings.net world ranking.
          # Select the team/name, country code, and rating columns by their
          # documented names where available, with a small fallback for site changes.
          def pick(candidates):
              for c in candidates:
                  if c in df.columns:
                      return c
              return None

          team_col = pick(['team', 'country', 'name'])
          code_col = pick(['code', 'country_code', 'countryCode'])
          elo_col = pick(['elo', 'rating', 'Elo', 'elo_rating'])

          if not team_col or not elo_col:
              raise RuntimeError(f'Could not identify team/rating columns: {list(df.columns)}')

          teams=[]
          for rank, (_, row) in enumerate(df.iterrows(), start=1):
              team=str(row[team_col]).strip()
              if not team or team.lower() == 'nan':
                  continue
              try:
                  elo=float(row[elo_col])
              except (TypeError, ValueError):
                  continue
              item={'rank': rank, 'team': team, 'code': str(row[code_col]).strip() if code_col and str(row[code_col]) != 'nan' else '', 'elo': round(elo)}
              teams.append(item)

          teams.sort(key=lambda x: x['elo'], reverse=True)
          for i, item in enumerate(teams, start=1):
              item['rank']=i

          output={
              'source':'World Football Elo Ratings (eloratings.net)',
              'updatedAt':datetime.now(timezone.utc).isoformat(),
              'teams':teams
          }
          with open('ratings.json','w',encoding='utf-8') as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print(f'Wrote {len(teams)} teams.')
          PY

      - name: Commit updated ratings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ratings.json
          if git diff --cached --quiet; then
            echo 'No Elo changes.'
          else
            git commit -m 'Update Elo ratings'
            git push
          fi
