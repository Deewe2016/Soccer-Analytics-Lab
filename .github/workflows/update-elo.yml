name: Update Elo ratings

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-elo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install data tools
        run: python -m pip install --upgrade pip datafc pycountry
      - name: Fetch latest World Football Elo ratings
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import pycountry
          from datafc import eloratings

          df = eloratings.world_ranking_data()
          def pick(candidates):
              for c in candidates:
                  if c in df.columns: return c
              return None
          team_col=pick(['team','country','name'])
          code_col=pick(['code','country_code','countryCode'])
          elo_col=pick(['elo','rating','Elo','elo_rating'])
          if not team_col or not elo_col:
              raise RuntimeError(f'Could not identify team/rating columns: {list(df.columns)}')

          special={'EN':'England','WA':'Wales','SQ':'Scotland','NI':'Northern Ireland','KO':'Kosovo','CD':'Democratic Republic of the Congo','CI':"Côte d'Ivoire",'EI':'Ireland','NM':'North Macedonia','NS':'Northern Cyprus','CW':'Curaçao','KD':'Kosovo'}
          def full_name(raw, code):
              raw=str(raw).strip()
              code=str(code).strip().upper() if code is not None else ''
              if raw and len(raw)>2 and raw.lower()!='nan': return raw
              if code in special: return special[code]
              try:
                  c=pycountry.countries.get(alpha_2=code)
                  if c: return c.name
              except Exception: pass
              return raw if raw and raw.lower()!='nan' else code

          teams=[]
          for _,row in df.iterrows():
              code=row[code_col] if code_col else ''
              team=full_name(row[team_col],code)
              try: elo=round(float(row[elo_col]))
              except (TypeError,ValueError): continue
              if not team: continue
              teams.append({'team':team,'code':str(code).strip() if str(code)!='nan' else '','elo':elo})
          teams.sort(key=lambda x:x['elo'],reverse=True)
          for i,item in enumerate(teams,1): item['rank']=i
          output={'source':'World Football Elo Ratings (eloratings.net)','updatedAt':datetime.now(timezone.utc).isoformat(),'teams':teams}
          with open('ratings.json','w',encoding='utf-8') as f: json.dump(output,f,ensure_ascii=False,indent=2); f.write('\n')
          print(f'Wrote {len(teams)} teams.')
          PY
      - name: Commit updated ratings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ratings.json
          if git diff --cached --quiet; then echo 'No Elo changes.'; else git commit -m 'Update Elo ratings'; git push; fi
