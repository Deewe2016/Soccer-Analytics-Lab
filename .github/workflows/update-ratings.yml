name: Update Elo ratings

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download World Football Elo ratings
        run: curl --fail --location --retry 3 --output World.tsv https://www.eloratings.net/World.tsv

      - name: Install country-name lookup
        run: python -m pip install pycountry

      - name: Convert TSV to JSON
        run: |
          python - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          import pycountry

          # World Football Elo uses a few custom two-letter codes for
          # football associations that are not ISO country codes.
          custom_names = {
              "EN": "England",
              "WA": "Wales",
              "SQ": "Scotland",
              "EI": "Ireland",
              "KO": "Kosovo",
              "CD": "Democratic Republic of the Congo",
              "PS": "Palestine",
              "BA": "Bosnia and Herzegovina",
              "RE": "Réunion",
              "NS": "Northern Cyprus",
          }

          def full_name(code):
              code = code.strip().upper()
              if code in custom_names:
                  return custom_names[code]
              country = pycountry.countries.get(alpha_2=code)
              if country:
                  return getattr(country, "common_name", None) or country.name
              return code

          rows = []
          with open("World.tsv", newline="", encoding="utf-8") as f:
              reader = csv.reader(f, delimiter="\t")
              for row in reader:
                  if len(row) < 4:
                      continue
                  try:
                      rank = int(row[0])
                      code = row[2].strip()
                      elo = int(float(row[3]))
                  except (ValueError, TypeError):
                      continue
                  if code:
                      rows.append({"rank": rank, "team": full_name(code), "code": code, "elo": elo})

          rows.sort(key=lambda x: (x["rank"], x["team"]))
          payload = {
              "source": "World Football Elo Ratings (eloratings.net)",
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "teams": rows
          }
          with open("ratings.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
          print(f"Saved {len(rows)} teams")
          PY
          rm World.tsv

      - name: Commit updated ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ratings.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Elo ratings"
          git push
